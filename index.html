<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qo'shilmagan So'zlar – B1/B2/C1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0e17;
    --surface: #1a1830;
    --card: #211f35;
    --accent: #e8c547;
    --accent2: #ff6b6b;
    --accent3: #6bcbff;
    --correct: #4ade80;
    --wrong: #f87171;
    --text: #fffffe;
    --muted: #a7a9be;
    --border: rgba(232,197,71,0.15);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(232,197,71,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(107,203,255,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .screen { display:none; position:relative; z-index:1; }
  .screen.active { display:block; }

  #welcome {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  #welcome.active { display:flex; }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(232,197,71,0.1);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 0.4rem 1.2rem;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1.05rem;
    font-weight: 300;
    margin-bottom: 3rem;
    max-width: 460px;
    line-height: 1.6;
  }

  .level-selector {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .level-btn {
    padding: 0.6rem 1.4rem;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .level-btn:hover { border-color: var(--accent); color: var(--accent); }
  .level-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f0e17;
    font-weight: 600;
  }

  .count-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .count-label { color: var(--muted); font-size: 0.9rem; }
  .count-input {
    width: 80px;
    padding: 0.5rem 0.8rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .count-input:focus { border-color: var(--accent); }

  .direction-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dir-btn {
    padding: 0.55rem 1.2rem;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .dir-btn:hover { border-color: var(--accent3); color: var(--accent3); }
  .dir-btn.selected {
    background: var(--accent3);
    border-color: var(--accent3);
    color: #0f0e17;
    font-weight: 600;
  }

  .start-btn {
    padding: 1rem 3rem;
    background: linear-gradient(135deg, var(--accent), #f0a500);
    border: none;
    border-radius: 50px;
    color: #0f0e17;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 30px rgba(232,197,71,0.25);
    letter-spacing: 0.02em;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(232,197,71,0.35); }

  .stats-row {
    display: flex;
    gap: 2rem;
    margin-top: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label { color: var(--muted); font-size: 0.8rem; }

  /* ===== QUIZ ===== */
  #quiz {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  #quiz.active { display:flex; }

  .quiz-header {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .progress-wrap {
    flex: 1;
    margin: 0 1rem;
  }
  .progress-bar {
    height: 4px;
    background: var(--surface);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #f0a500);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-text {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  .score-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.3rem 0.8rem;
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
  }

  .home-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }

  .question-card {
    width: 100%;
    max-width: 500px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }

  .level-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.2rem 0.7rem;
    border-radius: 20px;
    margin-bottom: 1.2rem;
  }
  .level-tag.b1 { background: rgba(232,197,71,0.15); color: var(--accent); }
  .level-tag.b2 { background: rgba(255,107,107,0.15); color: var(--accent2); }
  .level-tag.c1 { background: rgba(180,107,255,0.15); color: #b46bff; }

  .question-word {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .question-hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
  }

  .answer-input {
    width: 100%;
    padding: 0.9rem 1.2rem;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
    margin-top: 1rem;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: var(--correct); background: rgba(74,222,128,0.08); }
  .answer-input.wrong { border-color: var(--wrong); background: rgba(248,113,113,0.08); }

  .answer-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 1.2rem;
  }

  .option-btn {
    padding: 0.85rem 1rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.3;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .option-btn.correct { background: rgba(74,222,128,0.15); border-color: var(--correct); color: var(--correct); }
  .option-btn.wrong { background: rgba(248,113,113,0.12); border-color: var(--wrong); color: var(--wrong); }
  .option-btn:disabled { cursor: default; }

  .feedback-area {
    min-height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 1rem;
  }
  .feedback-correct { color: var(--correct); }
  .feedback-wrong { color: var(--wrong); }

  .next-btn {
    padding: 0.85rem 2.5rem;
    background: linear-gradient(135deg, var(--accent), #f0a500);
    border: none;
    border-radius: 50px;
    color: #0f0e17;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s;
    display: none;
  }
  .next-btn.visible { display: inline-block; }
  .next-btn:hover { transform: translateY(-1px); }

  /* ===== RESULT ===== */
  #result {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  #result.active { display:flex; }

  .result-emoji { font-size: 4rem; margin-bottom: 1rem; }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .result-score {
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Playfair Display', serif;
    margin: 1rem 0;
  }
  .result-sub { color: var(--muted); margin-bottom: 2rem; }

  .result-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  .btn-secondary {
    padding: 0.8rem 2rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .wrong-list-wrap { margin-top: 2rem; width: 100%; max-width: 480px; text-align: left; }
  .wrong-list-title { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.8rem; text-align: center; }
  .wrong-list { display: none; }
  .wrong-item {
    background: var(--card);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 10px;
    padding: 0.6rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
  }
  .wi-tr { font-weight: 600; }
  .wi-uz { color: var(--muted); }
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div class="logo-badge">✦ Hilol Edu Lug'at</div>
  <h1 class="main-title">Qo'shilmagan<br>So'zlar</h1>
  <p class="subtitle">B1, B2 va C1 darajalar uchun asosiy faylda yo'q bo'lgan so'zlar. Savol-javob rejimida mashq qiling.</p>

  <div class="level-selector">
    <button class="level-btn selected" data-level="all">Hammasi</button>
    <button class="level-btn" data-level="b1" style="border-color:rgba(232,197,71,0.3)">B1</button>
    <button class="level-btn" data-level="b2" style="border-color:rgba(255,107,107,0.3)">B2</button>
    <button class="level-btn" data-level="c1" style="border-color:rgba(180,107,255,0.3)">C1</button>
  </div>

  <div class="count-row">
    <span class="count-label">Savollar soni:</span>
    <input type="number" class="count-input" id="countInput" value="20" min="5" max="200">
  </div>

  <div class="direction-row">
    <button class="dir-btn selected" data-dir="tr-uz">TR → UZ</button>
    <button class="dir-btn" data-dir="uz-tr">UZ → TR</button>
  </div>

  <button class="start-btn" onclick="startQuiz()">Boshlash</button>

  <div class="stats-row">
    <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Jami so'z</div></div>
    <div class="stat-item"><div class="stat-num" id="statB1">0</div><div class="stat-label">B1</div></div>
    <div class="stat-item"><div class="stat-num" id="statB2">0</div><div class="stat-label">B2</div></div>
    <div class="stat-item"><div class="stat-num" id="statC1">0</div><div class="stat-label">C1</div></div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="home-btn" onclick="goHome()">←</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>
    <div class="score-badge" id="scoreBadge">0 ✓</div>
  </div>

  <div class="question-card">
    <div class="level-tag" id="levelTag">B1</div>
    <div class="question-word" id="questionWord">—</div>
    <div class="question-hint" id="questionHint"></div>
    <div class="answer-options" id="answerOptions"></div>
  </div>

  <div class="feedback-area" id="feedbackArea"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Keyingisi →</button>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-emoji" id="resultEmoji">🎉</div>
  <h2 class="result-title" id="resultTitle">Barakalla!</h2>
  <div class="result-score" id="resultScore">0/0</div>
  <p class="result-sub" id="resultSub"></p>
  <div class="result-actions">
    <button class="btn-secondary" onclick="showWrongList()">Xatolarni ko'rish</button>
    <button class="start-btn" onclick="restartQuiz()">Qayta urinish</button>
    <button class="btn-secondary" onclick="goHome()">Bosh sahifa</button>
  </div>
  <div class="wrong-list-wrap">
    <div class="wrong-list-title">Noto'g'ri javoblar:</div>
    <div class="wrong-list" id="wrongList"></div>
  </div>
</div>

// State
let selectedLevel = 'all';
let selectedDir = 'tr-uz';
let questionCount = 20;
let sessionWords = [];
let currentIdx = 0;
let score = 0;
let wrongAnswers = [];
let answered = false;

// Init
function updateStats() {
  const b1 = words.filter(w=>w.level==='b1').length;
  const b2 = words.filter(w=>w.level==='b2').length;
  const c1 = words.filter(w=>w.level==='c1').length;
  document.getElementById('statTotal').textContent = words.length;
  document.getElementById('statB1').textContent = b1;
  document.getElementById('statB2').textContent = b2;
  document.getElementById('statC1').textContent = c1;
}
updateStats();

// Level buttons
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedLevel = btn.dataset.level;
  });
});

// Direction buttons
document.querySelectorAll('.dir-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.dir-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDir = btn.dataset.dir;
  });
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startQuiz() {
  const pool = selectedLevel === 'all' ? words : words.filter(w=>w.level===selectedLevel);
  if(pool.length === 0) { alert("Bu daraja uchun so'z yo'q!"); return; }
  questionCount = Math.min(parseInt(document.getElementById('countInput').value)||20, pool.length);
  sessionWords = shuffle(pool).slice(0, questionCount);
  currentIdx = 0; score = 0; wrongAnswers = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const w = sessionWords[currentIdx];
  answered = false;

  // Progress
  const pct = (currentIdx / sessionWords.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (currentIdx+1) + ' / ' + sessionWords.length;
  document.getElementById('scoreBadge').textContent = score + ' ✓';

  // Level tag
  const lt = document.getElementById('levelTag');
  lt.textContent = w.level.toUpperCase();
  lt.className = 'level-tag ' + w.level;

  // Question
  const qWord = selectedDir === 'tr-uz' ? w.tr : w.uz;
  const hint = selectedDir === 'tr-uz' ? 'Turkchasini o\'zbek tilida yozing / tanlang' : 'O\'zbekcha so\'zning turkchasini tanlang';
  document.getElementById('questionWord').textContent = qWord;
  document.getElementById('questionHint').textContent = hint;

  // Options
  const correct = selectedDir === 'tr-uz' ? w.uz : w.tr;
  const allPool = selectedDir === 'tr-uz' ? words.map(x=>x.uz) : words.map(x=>x.tr);
  const wrongOpts = shuffle(allPool.filter(x=>x!==correct)).slice(0,3);
  const options = shuffle([correct, ...wrongOpts]);

  const container = document.getElementById('answerOptions');
  container.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, correct, btn);
    container.appendChild(btn);
  });

  document.getElementById('feedbackArea').innerHTML = '';
  document.getElementById('nextBtn').classList.remove('visible');
}

function checkAnswer(chosen, correct, btn) {
  if(answered) return;
  answered = true;
  const w = sessionWords[currentIdx];

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if(b.textContent === correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedbackArea');
  if(chosen === correct) {
    score++;
    btn.classList.add('correct');
    fb.innerHTML = '<span class="feedback-correct">✓ To\'g\'ri!</span>';
  } else {
    btn.classList.add('wrong');
    wrongAnswers.push(w);
    fb.innerHTML = `<span class="feedback-wrong">✗ Noto'g'ri! To'g'ri: <strong>${correct}</strong></span>`;
  }
  document.getElementById('scoreBadge').textContent = score + ' ✓';
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
  currentIdx++;
  if(currentIdx >= sessionWords.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  showScreen('result');
  const pct = Math.round((score/sessionWords.length)*100);
  let emoji = pct>=80?'🎉':pct>=50?'💪':'📚';
  let title = pct>=80?"Ajoyib natija!":pct>=50?"Yaxshi harakat!":"Ko'proq mashq qiling!";
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = score+'/'+sessionWords.length;
  document.getElementById('resultSub').textContent = pct+"% to'g'ri javob";
  document.getElementById('wrongList').style.display = 'none';
}

function showWrongList() {
  const wl = document.getElementById('wrongList');
  if(wrongAnswers.length > 0) {
    let html = '';
    const show = wrongAnswers.slice(0,15);
    show.forEach(w=>{
      html += `<div class="wrong-item"><span class="wi-tr">${w.tr}</span><span class="wi-uz">${w.uz}</span></div>`;
    });
    if(wrongAnswers.length>15) {
      html += `<div style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0">... va yana ${wrongAnswers.length-15} ta</div>`;
    }
    wl.innerHTML = html;
    wl.style.display = 'block';
  } else {
    wl.innerHTML = `<div style="text-align:center;color:var(--correct);padding:1rem">🎯 Barcha javoblar to'g'ri!</div>`;
    wl.style.display = 'block';
  }
}

function restartQuiz() { startQuiz(); }
function goHome() { showScreen('welcome'); }
